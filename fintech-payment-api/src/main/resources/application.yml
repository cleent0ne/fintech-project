spring:
  application:
    name: fintech-payment-api

  config:
    import: "optional:dotenv:.env"

  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: false  # disable default static resource handling

  datasource:
    url: ${DATABASE_URL}
    driverClassName: org.postgresql.Driver
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 200
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false  # enable only via application-dev.yml

  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    # Keep security logs at WARN in production — DEBUG exposes token details
    org.springframework.security: WARN
    root: INFO

  app:
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
