spring:
  application:
    name: fintech-payment-api

  config:
    import: "optional:dotenv:.env"

  datasource:
    url: ${DATABASE_URL}
    driverClassName: org.postgresql.Driver
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false  # enable only via application-dev.yml

  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    # Keep security logs at WARN in production — DEBUG exposes token details
    org.springframework.security: WARN
    root: INFO
